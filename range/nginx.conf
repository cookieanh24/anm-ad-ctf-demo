# TCP stream gateway: one IP (the team alias) exposing both service ports.
events {}

stream {
    # bouquets (Flask) on :5000
    server {
        listen 5000;
        proxy_pass bouquets:5000;
    }

    # otkritki (Go backend) on :8083
    server {
        listen 8083;
        proxy_pass backend:8083;
    }
}
